<!DOCTYPE html>
<html>
 <head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate" />
  <meta http-equiv="Pragma" content="no-cache" />
  <meta http-equiv="Expires" content="0" />
  <title>Tourmaline Core</title>
  <style>
    :root {
      --color-black: #000;
      --color-white: #fff;
      --color-grey-300-redesign: #b0b0b0;
    }

    *,
    *::before,
    *::after {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      background-color: var(--color-black);
    }

    .container-redesign {
      margin: 0 auto;
      padding-right: 12px;
      padding-left: 12px;
      max-width: 1920px;
    }

    .custom-error {
      position: relative;
      padding-top: 200px;
      padding-bottom: 104px;
      background-color: var(--color-black);
    }

    .custom-error__logo {
      position: absolute;
      top: 24px;
      left: 12px;
      display: block;
      max-width: 100px;
      width: 100%;
      height: auto;
    }

    .custom-error__wrapper {
      margin: 0 auto;
      max-width: 351px;
      text-align: center;
    }

    .custom-error__title {
      color: var(--color-white);
      font-weight: 400;
      font-family: 'Unbounded', sans-serif;
      font-size: 80px;
      line-height: 1;
      margin-bottom: 24px;
    }

    .custom-error__message {
      font-weight: 500;
      font-family: 'Inter', sans-serif;
      font-size: 16px;
      line-height: 1.2;
      margin-bottom: 56px;
      color: var(--color-grey-300-redesign);
    }

    @media (min-width: 480px) {
      .custom-error__title {
        font-size: 120px;
      }

      .custom-error__logo {
        max-width: 120px;
      }
    }

    @media (min-width: 768px) {
      .custom-error {
        padding-top: 164px;
      }

      .container-redesign {
        padding-right: 16px;
        padding-left: 16px;
      }

      .custom-error__logo {
        top: 32px;
        left: 16px;
        max-width: 140px;
      }

      .custom-error__wrapper {
        max-width: 440px;
      }

      .custom-error__title {
        font-size: 140px;
      }
    }

    @media (min-width: 1024px) {
      .custom-error {
        padding-top: 175px;
        padding-bottom: 175px;
      }

      .custom-error__wrapper {
        max-width: 526px;
      }

      .custom-error__title {
        font-size: 160px;
      }

      .custom-error__message {
        font-size: 18px;
        line-height: 1.4;
      }

      .custom-error__logo {
        top: 40px;
        left: 16px;
        max-width: 160px;
      }
    }

    @media (min-width: 1280px) {
      .custom-error {
        padding-top: 240px;
        padding-bottom: 240px;
      }

      .custom-error__wrapper {
        max-width: 680px;
      }

      .custom-error__title {
        font-size: 240px;
      }

      .custom-error__message {
        font-size: 24px;
      }

      .custom-error__logo {
        top: 48px;
        left: 24px;
        max-width: 180px;
      }

      .container-redesign {
        padding-right: 24px;
        padding-left: 24px;
      }
    }
  </style>
 </head>
 <body>
  <section class="custom-error container-redesign">
      <img class="custom-error__logo" src="./logo.png" alt="" />
      <div class="custom-error__wrapper">
        <h1 class="custom-error__title">503</h1>
        <p class="custom-error__message">
          Unfortunately, our website is temporarily unavailable — the data center which hosts it is out of service. We are currently working to restore it.
        </p>
      </div>
    </section>
 </body>
 </html>
